{% extends "base.html" %}
{% block title %}Tài khoản{% endblock %}
{% block content %}
<h1 class="page">{{ 'Cập nhật tài khoản' if u else 'Tạo tài khoản' }}</h1>
<form method="post" class="card card-body" style="max-width:640px">{{ csrf_input() }}
  <label class="form-label">Email (tên đăng nhập) {{ '*' if not u }}</label><input class="form-control mb-3" name="email" value="{{ f.get('email') or '' }}" {{ 'disabled' if u }}>
  <label class="form-label">Họ tên *</label><input class="form-control mb-3" name="full_name" value="{{ f.get('full_name') or '' }}">
  {% if not u %}<label class="form-label">Số điện thoại</label><input class="form-control mb-3" name="phone" value="{{ f.get('phone') or '' }}">{% endif %}
  <label class="form-label">{{ 'Mật khẩu mới (bỏ trống nếu không đổi)' if u else 'Mật khẩu *' }}</label><input type="password" class="form-control mb-1" name="password" autocomplete="new-password">
  <div class="form-text mb-3">Tối thiểu 8 ký tự, gồm chữ hoa và số</div>
  <label class="form-label">Vai trò *</label><select class="form-select mb-3" name="role_id">{% for r in roles %}<option value="{{ r.role_id }}" {{ 'selected' if f.get('role_id')|string==r.role_id|string }}>{{ ROLE_LABEL[r.role_code] }}</option>{% endfor %}</select>
  {% if u %}<label class="form-label">Trạng thái</label><select class="form-select mb-3" name="status"><option value="ACTIVE" {{ 'selected' if f.get('status')=='ACTIVE' }}>Hoạt động</option><option value="LOCKED" {{ 'selected' if f.get('status')=='LOCKED' }}>Khóa</option></select>{% endif %}
  <div><button class="btn btn-brand">Lưu</button> <a class="btn btn-link" href="{{ url_for('admin.accounts') }}">Hủy</a></div>
</form>
{% endblock %}
