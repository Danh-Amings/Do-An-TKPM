{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card"><div class="card-body p-4">
  <h1 class="page">Đổi mật khẩu</h1>
  <form method="post">
    {{ csrf_input() }}
    <div class="mb-3"><label class="form-label">Mật khẩu hiện tại</label><input class="form-control" type="password" name="current"></div>
    <div class="mb-3"><label class="form-label">Mật khẩu mới</label><input class="form-control" type="password" name="password"></div>
    <div class="mb-3"><label class="form-label">Xác nhận mật khẩu mới</label><input class="form-control" type="password" name="password2"></div>
    <button class="btn btn-brand">Lưu thay đổi</button>
  </form>
</div></div></div></div>
{% endblock %}
